<!DOCTYPE html>
<html>
<head>
<title>Tag Game</title>
<style>
body { margin:0; overflow:hidden; background:#222; }
canvas { background:#5b9b4c; display:block; }
#info {
  position:fixed; top:10px; left:10px;
  background:white; padding:10px;
  font-family:Arial; border-radius:8px;
}
</style>
</head>

<body>

<div id="info">
  <b>TAG!</b><br>
  You are: <span id="role">RUNNER</span><br>
  Time: <span id="time">60</span>
</div>

<canvas id="game"></canvas>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

c.width = innerWidth;
c.height = innerHeight;

let time = 60;
let keys = {};
let it = Math.random() < .5 ? "player" : "bot";

let player = {
  x:200, y:200, r:15
};

let bot = {
  x:600, y:300, r:15
};

document.onkeydown = e => keys[e.key.toLowerCase()] = true;
document.onkeyup = e => keys[e.key.toLowerCase()] = false;

function move() {
  if(keys.w || keys.arrowup) player.y -= 4;
  if(keys.s || keys.arrowdown) player.y += 4;
  if(keys.a || keys.arrowleft) player.x -= 4;
  if(keys.d || keys.arrowright) player.x += 4;

  // Bot chases player when it is IT
  if(it === "bot") {
    if(bot.x < player.x) bot.x += 2;
    if(bot.x > player.x) bot.x -= 2;
    if(bot.y < player.y) bot.y += 2;
    if(bot.y > player.y) bot.y -= 2;
  } else {
    // Bot runs away
    if(bot.x < player.x) bot.x -= 2;
    else bot.x += 2;
  }

  // Tag
  let dx = player.x - bot.x;
  let dy = player.y - bot.y;
  let dist = Math.hypot(dx,dy);

  if(dist < 30) {
    it = it === "player" ? "bot" : "player";
  }
}

function draw() {
  ctx.clearRect(0,0,c.width,c.height);

  ctx.fillStyle = it === "player" ? "red" : "blue";
  ctx.beginPath();
  ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = it === "bot" ? "red" : "yellow";
  ctx.beginPath();
  ctx.arc(bot.x,bot.y,bot.r,0,Math.PI*2);
  ctx.fill();

  document.getElementById("role").textContent =
    it === "player" ? "IT 🔴" : "RUNNER 🔵";

  document.getElementById("time").textContent = time;
}

setInterval(() => {
  if(time > 0) time--;
  else {
    alert(it === "player" ? "You lost!" : "You survived!");
    location.reload();
  }
},1000);

function game() {
  move();
  draw();
  requestAnimationFrame(game);
}

game();
</script>

</body>
</html>
